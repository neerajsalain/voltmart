<svg viewBox="0 0 700 520" xmlns="http://www.w3.org/2000/svg" width="700" height="520">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGlow" cx="60%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1a0800" />
      <stop offset="100%" stop-color="#0a0400" />
    </radialGradient>

    <!-- Orange glow gradient -->
    <radialGradient id="orangeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0" />
    </radialGradient>

    <!-- Blue glow gradient -->
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Plug glow -->
    <radialGradient id="plugGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#f97316" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0" />
    </radialGradient>

    <!-- Wire gradient -->
    <linearGradient id="wireGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="wireGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="wireGrad3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0.1" />
    </linearGradient>

    <!-- Bolt gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Circuit board gradient -->
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a4a" />
      <stop offset="100%" stop-color="#0f2030" />
    </linearGradient>

    <!-- LED glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="strongGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Noise texture -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feBlend in="SourceGraphic" mode="overlay" result="blend" />
      <feComposite in="blend" in2="SourceGraphic" operator="in" />
    </filter>
  </defs>

  <!-- ── BACKGROUND ── -->
  <rect width="700" height="520" fill="url(#bgGlow)" />
  <rect width="700" height="520" fill="url(#bgGlow)" opacity="0.5" />

  <!-- Noise overlay -->
  <rect width="700" height="520" opacity="0.03">
    <animate attributeName="opacity" values="0.03;0.05;0.03" dur="4s" repeatCount="indefinite" />
  </rect>

  <!-- Ambient glow spots -->
  <ellipse cx="460" cy="200" rx="220" ry="200" fill="url(#orangeGlow)" opacity="0.6" />
  <ellipse cx="120" cy="380" rx="160" ry="140" fill="url(#blueGlow)" opacity="0.5" />

  <!-- ── CIRCUIT BOARD BASE (bottom-right quadrant) ── -->
  <g opacity="0.15">
    <!-- Horizontal traces -->
    <line x1="300" y1="340" x2="700" y2="340" stroke="#38bdf8" stroke-width="1" />
    <line x1="350" y1="380" x2="700" y2="380" stroke="#38bdf8" stroke-width="1" />
    <line x1="420" y1="420" x2="700" y2="420" stroke="#38bdf8" stroke-width="0.8" />
    <line x1="300" y1="460" x2="700" y2="460" stroke="#38bdf8" stroke-width="0.8" />
    <!-- Vertical traces -->
    <line x1="380" y1="300" x2="380" y2="520" stroke="#38bdf8" stroke-width="1" />
    <line x1="450" y1="320" x2="450" y2="520" stroke="#38bdf8" stroke-width="0.8" />
    <line x1="520" y1="340" x2="520" y2="520" stroke="#38bdf8" stroke-width="1" />
    <line x1="600" y1="300" x2="600" y2="520" stroke="#38bdf8" stroke-width="0.8" />
    <!-- Junction dots -->
    <circle cx="380" cy="340" r="3" fill="#38bdf8" />
    <circle cx="450" cy="380" r="3" fill="#38bdf8" />
    <circle cx="520" cy="380" r="3" fill="#38bdf8" />
    <circle cx="520" cy="420" r="3" fill="#38bdf8" />
    <circle cx="600" cy="340" r="3" fill="#38bdf8" />
    <circle cx="600" cy="420" r="3" fill="#38bdf8" />
    <!-- IC chips -->
    <rect x="555" y="350" width="50" height="30" rx="3" fill="#0f2030" stroke="#38bdf8" stroke-width="0.8" />
    <rect x="410" y="390" width="40" height="25" rx="3" fill="#0f2030" stroke="#38bdf8" stroke-width="0.8" />
  </g>

  <!-- ── ANIMATED CIRCUIT TRACES (top layer) ── -->
  <g opacity="0.25">
    <line x1="0" y1="100" x2="200" y2="100" stroke="#f97316" stroke-width="1" />
    <line x1="200" y1="100" x2="200" y2="160" stroke="#f97316" stroke-width="1" />
    <line x1="200" y1="160" x2="260" y2="160" stroke="#f97316" stroke-width="1" />

    <line x1="0" y1="180" x2="140" y2="180" stroke="#f97316" stroke-width="0.8" />
    <line x1="140" y1="140" x2="140" y2="200" stroke="#f97316" stroke-width="0.8" />

    <circle cx="140" cy="180" r="2.5" fill="#f97316" />
    <circle cx="200" cy="100" r="2.5" fill="#f97316" />
    <circle cx="200" cy="160" r="2.5" fill="#f97316" />
  </g>

  <!-- ── FLOWING ENERGY LINES ── -->
  <!-- Main power cable - orange -->
  <path d="M 30 260 C 120 240, 180 300, 280 280 S 400 230, 500 260 S 620 300, 700 280"
    fill="none" stroke="url(#wireGrad2)" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />

  <!-- Secondary cable - blue -->
  <path d="M 0 320 C 80 300, 160 360, 260 340 S 380 290, 480 320 S 600 360, 700 340"
    fill="none" stroke="url(#wireGrad1)" stroke-width="2" stroke-linecap="round" opacity="0.5" />

  <!-- Tertiary - green -->
  <path d="M 0 420 C 100 400, 200 450, 320 430 S 450 400, 560 430 S 660 460, 700 445"
    fill="none" stroke="url(#wireGrad3)" stroke-width="1.5" stroke-linecap="round" opacity="0.35" />

  <!-- ── LARGE LIGHTNING BOLT (center-right) ── -->
  <g transform="translate(380, 60)">
    <!-- Outer glow -->
    <polygon points="80,0 40,120 80,100 30,220 130,80 80,100 110,0"
      fill="#f97316" opacity="0.08" filter="url(#strongGlow)" />
    <!-- Main bolt -->
    <polygon points="80,0 40,120 80,100 30,220 130,80 80,100 110,0"
      fill="url(#boltGrad)" filter="url(#glow)" />
    <!-- Inner bright -->
    <polygon points="80,10 50,105 80,88 42,200 118,90 80,88 108,10"
      fill="#fbbf24" opacity="0.6" />
    <!-- Highlight core -->
    <polygon points="80,20 58,95 80,80 52,180 108,95 80,80 104,20"
      fill="#fff" opacity="0.25" />

    <!-- Pulsing animation glow -->
    <polygon points="80,0 40,120 80,100 30,220 130,80 80,100 110,0"
      fill="#fbbf24" opacity="0">
      <animate attributeName="opacity" values="0;0.4;0" dur="2s" repeatCount="indefinite" />
    </polygon>
  </g>

  <!-- ── ELECTRICAL PLUG (center, floating) ── -->
  <g transform="translate(220, 130)" filter="url(#softGlow)">
    <!-- Plug body -->
    <rect x="30" y="0" width="80" height="110" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="1.5" />
    <!-- Plug face plate -->
    <rect x="35" y="5" width="70" height="90" rx="5" fill="#0f172a" />
    <!-- Left prong -->
    <rect x="52" y="30" width="12" height="35" rx="3" fill="#f97316" />
    <!-- Right prong -->
    <rect x="76" y="30" width="12" height="35" rx="3" fill="#f97316" />
    <!-- Ground pin -->
    <circle cx="70" cy="78" r="6" fill="#f97316" />
    <!-- Cable coming out of top -->
    <path d="M 70 0 L 70 -30 C 70 -40, 80 -45, 90 -50 S 110 -60, 130 -55"
      fill="none" stroke="#f97316" stroke-width="4" stroke-linecap="round" />

    <!-- Glow aura -->
    <ellipse cx="70" cy="55" rx="50" ry="60" fill="url(#plugGlow)" opacity="0.35" />

    <!-- Animated energy pulse -->
    <rect x="30" y="0" width="80" height="110" rx="8" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="stroke-width" values="1;3;1" dur="2.5s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- ── LED BULB (top-right area) ── -->
  <g transform="translate(570, 30)" filter="url(#softGlow)">
    <!-- Bulb glass -->
    <ellipse cx="40" cy="40" rx="30" ry="35" fill="#fbbf24" opacity="0.15" />
    <path d="M 16 50 C 16 20, 64 20, 64 50 C 64 68, 55 78, 40 82 C 25 78, 16 68, 16 50 Z"
      fill="none" stroke="#fbbf24" stroke-width="1.5" />
    <!-- Bulb base -->
    <rect x="28" y="82" width="24" height="8" rx="2" fill="#94a3b8" stroke="#64748b" stroke-width="0.8" />
    <rect x="30" y="90" width="20" height="6" rx="2" fill="#94a3b8" stroke="#64748b" stroke-width="0.8" />
    <rect x="32" y="96" width="16" height="5" rx="1" fill="#94a3b8" stroke="#64748b" stroke-width="0.8" />
    <!-- LED chip inside -->
    <circle cx="40" cy="50" r="8" fill="#fbbf24" opacity="0.8" />
    <circle cx="40" cy="50" r="4" fill="#fff" opacity="0.9" />
    <!-- Radiant glow lines -->
    <g stroke="#fbbf24" stroke-width="1" opacity="0.5">
      <line x1="40" y1="12" x2="40" y2="5" />
      <line x1="56" y1="22" x2="60" y2="17" />
      <line x1="24" y1="22" x2="20" y2="17" />
      <line x1="10" y1="50" x2="2" y2="50" />
      <line x1="70" y1="50" x2="78" y2="50" />
    </g>
    <!-- Ambient light circle -->
    <circle cx="40" cy="50" r="45" fill="#fbbf24" opacity="0.05" />

    <!-- Pulse animation -->
    <circle cx="40" cy="50" r="20" fill="#fbbf24" opacity="0">
      <animate attributeName="opacity" values="0;0.3;0" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="r" values="20;40;20" dur="1.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- ── CEILING FAN (left side, mid) ── -->
  <g transform="translate(60, 170)">
    <!-- Motor hub -->
    <circle cx="55" cy="55" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#softGlow)" />
    <circle cx="55" cy="55" r="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
    <circle cx="55" cy="55" r="4" fill="#38bdf8" opacity="0.8" />

    <!-- Fan blades -->
    <g transform="rotate(0, 55, 55)">
      <ellipse cx="55" cy="20" rx="8" ry="25" fill="#1e3a4a" stroke="#38bdf8" stroke-width="0.8" opacity="0.85" />
    </g>
    <g transform="rotate(120, 55, 55)">
      <ellipse cx="55" cy="20" rx="8" ry="25" fill="#1e3a4a" stroke="#38bdf8" stroke-width="0.8" opacity="0.85" />
    </g>
    <g transform="rotate(240, 55, 55)">
      <ellipse cx="55" cy="20" rx="8" ry="25" fill="#1e3a4a" stroke="#38bdf8" stroke-width="0.8" opacity="0.85" />
    </g>

    <!-- Mounting rod -->
    <rect x="52" y="-25" width="6" height="30" rx="2" fill="#38bdf8" opacity="0.4" />

    <!-- Rotation glow ring -->
    <circle cx="55" cy="55" r="40" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.2" stroke-dasharray="5 3">
      <animateTransform attributeName="transform" type="rotate" from="0 55 55" to="360 55 55" dur="3s" repeatCount="indefinite" />
    </circle>

    <!-- Center glow pulse -->
    <circle cx="55" cy="55" r="22" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0">
      <animate attributeName="opacity" values="0;0.5;0" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- ── WIRE/CABLE COIL (bottom left) ── -->
  <g transform="translate(20, 360)" opacity="0.7">
    <circle cx="55" cy="60" r="45" fill="none" stroke="#4ade80" stroke-width="3" stroke-dasharray="8 4" opacity="0.6" />
    <circle cx="55" cy="60" r="32" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-dasharray="6 3" opacity="0.5" />
    <circle cx="55" cy="60" r="18" fill="none" stroke="#4ade80" stroke-width="2" opacity="0.4" />
    <!-- Coil end -->
    <line x1="100" y1="60" x2="130" y2="50" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
    <!-- Label -->
    <rect x="20" y="50" width="70" height="20" rx="4" fill="rgba(74,222,128,0.1)" stroke="#4ade80" stroke-width="0.8" opacity="0.6" />
    <text x="55" y="64" text-anchor="middle" font-family="monospace" font-size="9" fill="#4ade80" opacity="0.8">ISI CERTIFIED</text>
  </g>

  <!-- ── MCB / SWITCH BOX (top-left) ── -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="100" height="130" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1" opacity="0.8" />
    <rect x="6" y="6" width="88" height="118" rx="4" fill="#0f172a" opacity="0.9" />
    <!-- MCB switches -->
    <g>
      <!-- MCB 1 - ON -->
      <rect x="14" y="18" width="20" height="38" rx="3" fill="#1e3a4a" stroke="#38bdf8" stroke-width="0.8" />
      <rect x="18" y="20" width="12" height="16" rx="2" fill="#38bdf8" opacity="0.9" />
      <text x="24" y="52" text-anchor="middle" font-family="monospace" font-size="6" fill="#38bdf8" opacity="0.7">ON</text>

      <!-- MCB 2 - ON -->
      <rect x="40" y="18" width="20" height="38" rx="3" fill="#1e3a4a" stroke="#4ade80" stroke-width="0.8" />
      <rect x="44" y="20" width="12" height="16" rx="2" fill="#4ade80" opacity="0.9" />
      <text x="50" y="52" text-anchor="middle" font-family="monospace" font-size="6" fill="#4ade80" opacity="0.7">ON</text>

      <!-- MCB 3 - OFF -->
      <rect x="66" y="18" width="20" height="38" rx="3" fill="#1e3a4a" stroke="#64748b" stroke-width="0.8" />
      <rect x="70" y="38" width="12" height="16" rx="2" fill="#64748b" opacity="0.6" />
      <text x="76" y="52" text-anchor="middle" font-family="monospace" font-size="6" fill="#64748b" opacity="0.7">OFF</text>
    </g>

    <!-- Status lights -->
    <circle cx="24" cy="68" r="4" fill="#38bdf8" filter="url(#glow)" opacity="0.9" />
    <circle cx="50" cy="68" r="4" fill="#4ade80" filter="url(#glow)" opacity="0.9" />
    <circle cx="76" cy="68" r="4" fill="#64748b" opacity="0.5" />

    <!-- Bottom label panel -->
    <rect x="8" y="82" width="84" height="30" rx="3" fill="#0a0a0f" stroke="#1e293b" stroke-width="0.8" />
    <text x="50" y="92" text-anchor="middle" font-family="monospace" font-size="7" fill="#f97316" opacity="0.9">MAIN PANEL</text>
    <text x="50" y="104" text-anchor="middle" font-family="monospace" font-size="6" fill="#64748b">DB-32A</text>

    <!-- Outer glow when "on" -->
    <rect x="0" y="0" width="100" height="130" rx="6" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.15" filter="url(#glow)" />
  </g>

  <!-- ── SMALL SPARKS / ENERGY PARTICLES ── -->
  <g filter="url(#glow)">
    <!-- Spark cluster near bolt -->
    <g transform="translate(490, 140)">
      <line x1="0" y1="0" x2="12" y2="-8" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" />
      <line x1="0" y1="0" x2="-10" y2="-12" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" />
      <line x1="0" y1="0" x2="15" y2="5" stroke="#fbbf24" stroke-width="1" stroke-linecap="round" />
      <line x1="0" y1="0" x2="-8" y2="10" stroke="#fbbf24" stroke-width="1" stroke-linecap="round" />
      <circle cx="0" cy="0" r="3" fill="#fbbf24" />
    </g>

    <!-- Spark cluster near plug -->
    <g transform="translate(315, 165)">
      <line x1="0" y1="0" x2="8" y2="-10" stroke="#f97316" stroke-width="1.5" stroke-linecap="round" />
      <line x1="0" y1="0" x2="-12" y2="-5" stroke="#f97316" stroke-width="1.5" stroke-linecap="round" />
      <line x1="0" y1="0" x2="10" y2="8" stroke="#f97316" stroke-width="1" stroke-linecap="round" />
      <circle cx="0" cy="0" r="2.5" fill="#f97316" />
    </g>

    <!-- Animated floating particles -->
    <circle cx="350" cy="180" r="2" fill="#fbbf24" opacity="0.8">
      <animate attributeName="cy" values="180;165;180" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="480" cy="280" r="1.5" fill="#f97316" opacity="0.7">
      <animate attributeName="cy" values="280;265;280" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="560" cy="200" r="2" fill="#38bdf8" opacity="0.6">
      <animate attributeName="cy" values="200;185;200" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="160" cy="300" r="1.5" fill="#4ade80" opacity="0.6">
      <animate attributeName="cy" values="300;288;300" dur="2.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- ── POWER METER / GAUGE (bottom center) ── -->
  <g transform="translate(260, 350)">
    <!-- Gauge body -->
    <rect x="0" y="0" width="120" height="80" rx="8" fill="#0f172a" stroke="#f97316" stroke-width="1" opacity="0.9" />
    <!-- Screen -->
    <rect x="8" y="8" width="104" height="48" rx="4" fill="#001208" stroke="#4ade80" stroke-width="0.5" />
    <!-- Digital reading -->
    <text x="60" y="30" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#4ade80">220V</text>
    <text x="60" y="46" text-anchor="middle" font-family="monospace" font-size="9" fill="#4ade80" opacity="0.7">AC SUPPLY</text>
    <!-- Bar indicator -->
    <rect x="12" y="60" width="96" height="6" rx="3" fill="#1e293b" />
    <rect x="12" y="60" width="72" height="6" rx="3" fill="#4ade80" filter="url(#glow)" />
    <!-- Small knobs -->
    <circle cx="20" cy="73" r="5" fill="#1e293b" stroke="#64748b" stroke-width="0.8" />
    <circle cx="60" cy="73" r="5" fill="#1e293b" stroke="#64748b" stroke-width="0.8" />
    <circle cx="100" cy="73" r="5" fill="#1e293b" stroke="#f97316" stroke-width="0.8" />

    <!-- Glow pulse -->
    <rect x="0" y="0" width="120" height="80" rx="8" fill="none" stroke="#4ade80" stroke-width="0.8" opacity="0">
      <animate attributeName="opacity" values="0;0.4;0" dur="2s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- ── BRAND WATERMARK ── -->
  <g transform="translate(540, 450)" opacity="0.12">
    <text font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#f97316" letter-spacing="-1">VOLT</text>
    <text x="68" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#fbbf24" letter-spacing="-1">MART</text>
  </g>

  <!-- ── TOP ENERGY WAVE ── -->
  <path d="M 0 490 Q 175 465, 350 480 T 700 470 L 700 520 L 0 520 Z"
    fill="#f97316" opacity="0.04" />
  <path d="M 0 500 Q 175 480, 350 492 T 700 483 L 700 520 L 0 520 Z"
    fill="#f97316" opacity="0.06" />

  <!-- ── GRID LINES (subtle) ── -->
  <g opacity="0.04" stroke="#94a3b8" stroke-width="0.5">
    <line x1="0" y1="130" x2="700" y2="130" />
    <line x1="0" y1="260" x2="700" y2="260" />
    <line x1="0" y1="390" x2="700" y2="390" />
    <line x1="175" y1="0" x2="175" y2="520" />
    <line x1="350" y1="0" x2="350" y2="520" />
    <line x1="525" y1="0" x2="525" y2="520" />
  </g>
</svg>
